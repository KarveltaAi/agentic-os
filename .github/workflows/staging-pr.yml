name: staging-pr
on:
  pull_request:
    branches: [staging]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm test 2>&1 || echo 'tests not configured yet'
      - run: curl -f http://localhost:3000 || echo 'smoke test: would check if site loads'
